name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the running check of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # a stuck apt mirror or model host should not hold the runner for hours
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 15
        run: ./scripts/setup-deps.sh
      - name: Rust version (part of the C2PA library's cache key)
        id: rust
        run: echo "version=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the C2PA library
        uses: actions/cache@v4
        with:
          path: ~/c2pa
          key: c2pa-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('scripts/build-c2pa.sh') }}
      - name: C2PA library (Content Credentials)
        run: scripts/build-c2pa.sh ~/c2pa
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMONTAGE_BUILD_APP=ON -DMONTAGE_REQUIRE_ONNXRUNTIME=ON -DC2PA_ROOT="$HOME/c2pa" -DMONTAGE_REQUIRE_C2PA=ON
      - name: Build
        run: cmake --build build
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/whisper-models
          key: whisper-ggml-tiny.en-v1
      - name: Speech model for the transcription tests
        run: |
          mkdir -p ~/whisper-models
          f="$HOME/whisper-models/ggml-tiny.en.bin"
          if [ ! -s "$f" ]; then
            curl -fL --retry 3 -o "$f" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin \
              || { rm -f "$f"; echo "::warning::Could not download the speech model; transcription tests will be skipped"; }
          fi
          [ -s "$f" ] && echo "MONTAGE_TEST_WHISPER_MODEL=$f" >> "$GITHUB_ENV" || true
      - name: GoPro's sample clips for the gyro stabilisation test
        run: |
          d="$HOME/gopro-samples"
          mkdir -p "$d"
          for f in hero5.mp4:04e45b2f41dff195b525fa18b7ed5517e5fc2d651127d1b57d1d931de306f915 hero8.mp4:0e068f543ebf59bccb4228e7b5950a4f681753d2bbbf1c838ae60336bc75c1bd; do
            name="${f%%:*}"
            curl -fsSL --retry 3 -o "$d/$name" "https://raw.githubusercontent.com/gopro/gpmf-parser/main/samples/$name" \
              && [ "$(sha256sum "$d/$name" | cut -d' ' -f1)" = "${f#*:}" ] \
              || { rm -f "$d/$name"; echo "::warning::Could not download GoPro's $name; its part of the gyro test will be skipped"; }
          done
          [ -s "$d/hero5.mp4" ] && echo "MONTAGE_GOPRO_SAMPLES=$d" >> "$GITHUB_ENV" || true
      - name: Cryptomatte's sample renders for the OpenEXR test
        run: |
          d="$HOME/cryptomatte-samples"
          mkdir -p "$d"
          base="https://raw.githubusercontent.com/Psyop/Cryptomatte/968d5e4b6171e29ba5f89d554117132a164e747e/sample_images"
          for f in bunny_CryptoObject.exr:259ab8eafda2b1282500960ea29bc14e70839aefe73103e9984e875f53f7b73b \
                   debug_images/multichannel.exr:41f3a864fe08cf2b981ee9ab267bd589abb9f1122a776557c6a7e493757b789e \
                   debug_images/sidecar_manifest.exr:b4ca37ae66763431b8a535b5b81552a9bcf2849f78537d445e6e2a5ab24d076e \
                   debug_images/sidecar_manifest.crypto_asset.json:443727159ca176685e4fed1951576c08efaecafa9195075d81dce5b696806a13 \
                   debug_images/special_chars.exr:a86dee943aa28dcc691b41c552b7ade871a6a40dc24098d02dacc23d49c1ed60; do
            path="${f%%:*}"
            name="$(basename "$path")"
            curl -fsSL --retry 3 -o "$d/$name" "$base/$path" \
              && [ "$(sha256sum "$d/$name" | cut -d' ' -f1)" = "${f#*:}" ] \
              || { rm -f "$d/$name"; echo "::warning::Could not download Cryptomatte's $name; the sample test will be skipped"; }
          done
          [ "$(ls "$d" | wc -l)" -eq 5 ] && echo "MONTAGE_CRYPTOMATTE_SAMPLES=$d" >> "$GITHUB_ENV" || true
      - name: Cache the AI models
        uses: actions/cache@v4
        with:
          path: ~/montage-models
          key: models-edgetam-8ca3d3e-speakers-9403a69-0743f30-clipq4-d15189d-dfn3-888f33c-esrgan-899dc1e-nafnet-f1f2551-faces-3cc26e7-3d70824-575c338-depth-4472b73-rife-01fdc7e-modnet-fa2fa54-kokoro-1939ad2-lama-c3c0c9e-minilm-3c96c1d-ocr-1cfba2e-7b02d0a-clap-c28f288-spleeter4-v140
      - name: AI models for the object mask, speaker and visual search tests
        run: |
          scripts/fetch-models.sh ~/montage-models \
            && { echo "MONTAGE_OBJECT_MODEL=$HOME/montage-models/edgetam-video"; echo "MONTAGE_SPEAKER_MODEL=$HOME/montage-models/speakers"; echo "MONTAGE_VISUAL_MODEL=$HOME/montage-models/clip-vit-b32"; echo "MONTAGE_SPEECH_MODEL=$HOME/montage-models/speech-enhance"; echo "MONTAGE_UPSCALE_MODEL=$HOME/montage-models/upscale"; echo "MONTAGE_DEBLUR_MODEL=$HOME/montage-models/deblur"; echo "MONTAGE_FACE_MODEL=$HOME/montage-models/faces"; echo "MONTAGE_DEPTH_MODEL=$HOME/montage-models/depth"; echo "MONTAGE_RIFE_MODEL=$HOME/montage-models/rife"; echo "MONTAGE_MATTE_MODEL=$HOME/montage-models/matte"; echo "MONTAGE_TTS_MODEL=$HOME/montage-models/tts"; echo "MONTAGE_INPAINT_MODEL=$HOME/montage-models/inpaint"; echo "MONTAGE_SENTENCE_MODEL=$HOME/montage-models/minilm-qa"; echo "MONTAGE_OCR_MODEL=$HOME/montage-models/ocr"; echo "MONTAGE_SOUND_MODEL=$HOME/montage-models/sound"; echo "MONTAGE_STEM_MODELS=$HOME/montage-models/stems"; } >> "$GITHUB_ENV" \
            || echo "::warning::Could not download the AI models; AI model tests will be skipped"
      # Its own cache, saved only once the whole model is here: the host it comes from can be slow, so the download is
      # given at most 12 minutes, and the test is skipped without it rather than the run timing out.
      - name: Restore the dialogue, music and effects model
        id: dme-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/montage-models/stems/bandit-v2-eng
          key: bandit-eng-12701995
      - name: The dialogue, music and effects model (447 MB)
        id: dme
        if: steps.dme-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          scripts/fetch-models.sh ~/montage-models --dme \
            || echo "::warning::Could not download the dialogue, music and effects model; its test will be skipped"
          rm -f ~/montage-models/stems/bandit-v2-eng/*.part
          if [ -s ~/montage-models/stems/bandit-v2-eng/checkpoint-eng.ckpt ]; then echo "fetched=1" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the dialogue, music and effects model
        if: steps.dme.outputs.fetched == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/montage-models/stems/bandit-v2-eng
          key: bandit-eng-12701995
      - name: Test
        run: ctest --test-dir build --output-on-failure
