name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the running check of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # a stuck apt mirror or model host should not hold the runner for hours (a full run is about 55 minutes)
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 15
        run: ./scripts/setup-deps.sh
      - name: Rust version (part of the C2PA library's cache key)
        id: rust
        run: echo "version=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the C2PA library
        uses: actions/cache@v4
        with:
          path: ~/c2pa
          key: c2pa-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('scripts/build-c2pa.sh') }}
      - name: C2PA library (Content Credentials)
        run: scripts/build-c2pa.sh ~/c2pa
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMONTAGE_BUILD_APP=ON -DMONTAGE_REQUIRE_ONNXRUNTIME=ON -DMONTAGE_REQUIRE_OPENSSL=ON -DC2PA_ROOT="$HOME/c2pa" -DMONTAGE_REQUIRE_C2PA=ON
      - name: Build
        run: cmake --build build
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/whisper-models
          key: whisper-ggml-tiny.en-v1
      - name: Speech model for the transcription tests
        run: |
          mkdir -p ~/whisper-models
          f="$HOME/whisper-models/ggml-tiny.en.bin"
          if [ ! -s "$f" ]; then
            curl -fL --retry 3 -o "$f" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin \
              || { rm -f "$f"; echo "::warning::Could not download the speech model; transcription tests will be skipped"; }
          fi
          [ -s "$f" ] && echo "MONTAGE_TEST_WHISPER_MODEL=$f" >> "$GITHUB_ENV" || true
      - name: GoPro's sample clips for the gyro stabilisation test
        run: |
          d="$HOME/gopro-samples"
          mkdir -p "$d"
          for f in hero5.mp4:04e45b2f41dff195b525fa18b7ed5517e5fc2d651127d1b57d1d931de306f915 hero8.mp4:0e068f543ebf59bccb4228e7b5950a4f681753d2bbbf1c838ae60336bc75c1bd; do
            name="${f%%:*}"
            curl -fsSL --retry 3 -o "$d/$name" "https://raw.githubusercontent.com/gopro/gpmf-parser/main/samples/$name" \
              && [ "$(sha256sum "$d/$name" | cut -d' ' -f1)" = "${f#*:}" ] \
              || { rm -f "$d/$name"; echo "::warning::Could not download GoPro's $name; its part of the gyro test will be skipped"; }
          done
          [ -s "$d/hero5.mp4" ] && echo "MONTAGE_GOPRO_SAMPLES=$d" >> "$GITHUB_ENV" || true
      - name: Cryptomatte's sample renders for the OpenEXR test
        run: |
          d="$HOME/cryptomatte-samples"
          mkdir -p "$d"
          base="https://raw.githubusercontent.com/Psyop/Cryptomatte/968d5e4b6171e29ba5f89d554117132a164e747e/sample_images"
          for f in bunny_CryptoObject.exr:259ab8eafda2b1282500960ea29bc14e70839aefe73103e9984e875f53f7b73b \
                   debug_images/multichannel.exr:41f3a864fe08cf2b981ee9ab267bd589abb9f1122a776557c6a7e493757b789e \
                   debug_images/sidecar_manifest.exr:b4ca37ae66763431b8a535b5b81552a9bcf2849f78537d445e6e2a5ab24d076e \
                   debug_images/sidecar_manifest.crypto_asset.json:443727159ca176685e4fed1951576c08efaecafa9195075d81dce5b696806a13 \
                   debug_images/special_chars.exr:a86dee943aa28dcc691b41c552b7ade871a6a40dc24098d02dacc23d49c1ed60; do
            path="${f%%:*}"
            name="$(basename "$path")"
            curl -fsSL --retry 3 -o "$d/$name" "$base/$path" \
              && [ "$(sha256sum "$d/$name" | cut -d' ' -f1)" = "${f#*:}" ] \
              || { rm -f "$d/$name"; echo "::warning::Could not download Cryptomatte's $name; the sample test will be skipped"; }
          done
          [ "$(ls "$d" | wc -l)" -eq 5 ] && echo "MONTAGE_CRYPTOMATTE_SAMPLES=$d" >> "$GITHUB_ENV" || true
      - name: Khronos's glTF sample models for the 3D model test
        run: |
          d="$HOME/gltf-samples"
          mkdir -p "$d"
          base="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0"
          # (CC BY 4.0, donated by Cesium; the repository is archived, and each file is checked by its hash)
          for f in Box/glTF-Binary/Box.glb:ed52f7192b8311d700ac0ce80644e3852cd01537e4d62241b9acba023da3d54e \
                   BoxTextured/glTF-Binary/BoxTextured.glb:2d055d2d56a492d1b9302de6e733046b625cf51e5f2a3090bd3a8c11acc93c17 \
                   CesiumMan/glTF-Binary/CesiumMan.glb:659349b0a374b73d5362a61070039bc8601401bbdeacbece4f3680fb4bfd41b0; do
            path="${f%%:*}"
            name="$(basename "$path")"
            curl -fsSL --retry 3 -o "$d/$name" "$base/$path" \
              && [ "$(sha256sum "$d/$name" | cut -d' ' -f1)" = "${f#*:}" ] \
              || { rm -f "$d/$name"; echo "::warning::Could not download $name; the sample model test will be skipped"; }
          done
          [ "$(ls "$d" | wc -l)" -eq 3 ] && echo "MONTAGE_TEST_GLTF_SAMPLES=$d" >> "$GITHUB_ENV" || true
      - name: Sample USD scenes for the USD test
        run: |
          d="$HOME/usd-samples"
          mkdir -p "$d"
          base="https://raw.githubusercontent.com/lighttransport/tinyusdz/c9f177148f7dcddde33f4f8d6e82599f151d8803/models"
          # (from the tinyusdz project, Apache-2.0; pinned to one commit, and each file is checked by its hash)
          for f in cube-previewsurface.usda:b3c573a7df10c5afec49b6aeb2acd0bd14d0c6d0494bfa38e2a1bf52f9e5c03d \
                   cube-previewsurface.usdc:aaf566ee46573643c6339d4792f63cdda453cdf29dcc2bf33e0052d8c1827df5 \
                   texture-cat-plane.usdz:54b6c54819b0735ac39b6dd833c5f999d282d418ffec0b247a2e9a303d064a48; do
            name="${f%%:*}"
            curl -fsSL --retry 3 -o "$d/$name" "$base/$name" \
              && [ "$(sha256sum "$d/$name" | cut -d' ' -f1)" = "${f#*:}" ] \
              || { rm -f "$d/$name"; echo "::warning::Could not download $name; the sample USD scene test will be skipped"; }
          done
          [ "$(ls "$d" | wc -l)" -eq 3 ] && echo "MONTAGE_TEST_USD_SAMPLES=$d" >> "$GITHUB_ENV" || true
      - name: Sample splat scene for the splat test
        run: |
          d="$HOME/spz-samples"
          mkdir -p "$d"
          # (from Niantic's spz project, MIT; pinned to one commit, and checked by its hash)
          url="https://raw.githubusercontent.com/nianticlabs/spz/affd0ecea7fbb4c265ee119475af7ee5b2997482/samples/hornedlizard.spz"
          curl -fsSL --retry 3 -o "$d/hornedlizard.spz" "$url" \
            && [ "$(sha256sum "$d/hornedlizard.spz" | cut -d' ' -f1)" = "a076ca6aeb9f1a8fe52526f4a7c381fe8fffec60c0d7eb64b45532189b64bc6a" ] \
            && echo "MONTAGE_TEST_SPZ_SAMPLES=$d" >> "$GITHUB_ENV" \
            || { rm -f "$d/hornedlizard.spz"; echo "::warning::Could not download hornedlizard.spz; the sample splat scene test will be skipped"; }
      - name: Cache the AI models
        uses: actions/cache@v4
        with:
          path: ~/montage-models
          key: models-edgetam-8ca3d3e-speakers-9403a69-0743f30-clipq4-d15189d-dfn3-888f33c-esrgan-899dc1e-nafnet-f1f2551-faces-3cc26e7-3d70824-575c338-depth-4472b73-vda-2568753-rife-01fdc7e-modnet-fa2fa54-kokoro-1939ad2-lama-c3c0c9e-minilm-3c96c1d-ocr-1cfba2e-7b02d0a-clap-c28f288-spleeter4-v140
      - name: AI models for the object mask, speaker and visual search tests
        run: |
          scripts/fetch-models.sh ~/montage-models \
            && { echo "MONTAGE_OBJECT_MODEL=$HOME/montage-models/edgetam-video"; echo "MONTAGE_SPEAKER_MODEL=$HOME/montage-models/speakers"; echo "MONTAGE_VISUAL_MODEL=$HOME/montage-models/clip-vit-b32"; echo "MONTAGE_SPEECH_MODEL=$HOME/montage-models/speech-enhance"; echo "MONTAGE_UPSCALE_MODEL=$HOME/montage-models/upscale"; echo "MONTAGE_DEBLUR_MODEL=$HOME/montage-models/deblur"; echo "MONTAGE_FACE_MODEL=$HOME/montage-models/faces"; echo "MONTAGE_DEPTH_MODEL=$HOME/montage-models/depth"; echo "MONTAGE_VIDEO_DEPTH_MODEL=$HOME/montage-models/video-depth"; echo "MONTAGE_RIFE_MODEL=$HOME/montage-models/rife"; echo "MONTAGE_MATTE_MODEL=$HOME/montage-models/matte"; echo "MONTAGE_TTS_MODEL=$HOME/montage-models/tts"; echo "MONTAGE_INPAINT_MODEL=$HOME/montage-models/inpaint"; echo "MONTAGE_SENTENCE_MODEL=$HOME/montage-models/minilm-qa"; echo "MONTAGE_OCR_MODEL=$HOME/montage-models/ocr"; echo "MONTAGE_SOUND_MODEL=$HOME/montage-models/sound"; echo "MONTAGE_STEM_MODELS=$HOME/montage-models/stems"; } >> "$GITHUB_ENV" \
            || echo "::warning::Could not download the AI models; AI model tests will be skipped"
      # Its own cache, saved only once the whole model is here: the host it comes from can be slow, so the download is
      # given at most 12 minutes, and the test is skipped without it rather than the run timing out.
      - name: Restore the dialogue, music and effects model
        id: dme-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/montage-models/stems/bandit-v2-eng
          key: bandit-eng-12701995
      - name: The dialogue, music and effects model (447 MB)
        id: dme
        if: steps.dme-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          scripts/fetch-models.sh ~/montage-models --dme \
            || echo "::warning::Could not download the dialogue, music and effects model; its test will be skipped"
          rm -f ~/montage-models/stems/bandit-v2-eng/*.part
          if [ -s ~/montage-models/stems/bandit-v2-eng/checkpoint-eng.ckpt ]; then echo "fetched=1" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the dialogue, music and effects model
        if: steps.dme.outputs.fetched == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/montage-models/stems/bandit-v2-eng
          key: bandit-eng-12701995
      # Saved only once both checkpoints are here, as the dialogue, music and effects model is.
      - name: Restore the speech bandwidth models
        id: bwe-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/montage-models/bwe
          key: apbwe-fa3f46d-8k16k-8k48k
      - name: The speech bandwidth models (two AP-BWE checkpoints, 238 MB)
        id: bwe
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if [ "${{ steps.bwe-cache.outputs.cache-hit }}" != "true" ]; then
            scripts/fetch-models.sh ~/montage-models --bwe-test \
              || echo "::warning::Could not download the speech bandwidth models; their test will be skipped"
            rm -f ~/montage-models/bwe/*/*.part
            if [ -s ~/montage-models/bwe/apbwe-8k-16k/generator.ckpt ] && [ -s ~/montage-models/bwe/apbwe-8k-48k/generator.ckpt ]; then echo "fetched=1" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "MONTAGE_BWE_MODELS=$HOME/montage-models/bwe" >> "$GITHUB_ENV"
      - name: Keep the speech bandwidth models
        if: steps.bwe.outputs.fetched == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/montage-models/bwe
          key: apbwe-fa3f46d-8k16k-8k48k
      - name: Cache the reference IAMF decoder
        uses: actions/cache@v4
        with:
          path: ~/iamfdec
          key: iamfdec-${{ runner.os }}-${{ hashFiles('scripts/build-iamfdec.sh') }}
      - name: The reference IAMF decoder for the immersive audio export test
        run: |
          scripts/build-iamfdec.sh ~/iamfdec && echo "MONTAGE_TEST_IAMFDEC=$HOME/iamfdec/bin/iamfdec" >> "$GITHUB_ENV" \
            || echo "::warning::Could not build the reference IAMF decoder; its part of the IAMF test will be skipped"
      - name: Cache the ARA test plug-in
        uses: actions/cache@v4
        with:
          path: ~/ara-test-plugin
          key: ara-test-plugin-${{ runner.os }}-${{ hashFiles('scripts/build-ara-test-plugin.sh') }}
      - name: The ARA SDK's test plug-in (VST3 and CLAP) for the ARA hosting test
        run: |
          scripts/build-ara-test-plugin.sh ~/ara-test-plugin && echo "MONTAGE_TEST_ARA_PLUGINS=$HOME/ara-test-plugin" >> "$GITHUB_ENV" \
            || echo "::warning::Could not build the ARA test plug-in; the ARA hosting tests will be skipped"
      - name: Cache the reference gain-map decoder
        uses: actions/cache@v4
        with:
          path: ~/ultrahdr
          key: ultrahdr-${{ runner.os }}-${{ hashFiles('scripts/build-ultrahdr.sh') }}
      - name: The reference gain-map decoder for the HDR stills test
        run: |
          scripts/build-ultrahdr.sh ~/ultrahdr && echo "MONTAGE_TEST_UHDR=$HOME/ultrahdr/bin/ultrahdr_app" >> "$GITHUB_ENV" \
            || echo "::warning::Could not build the reference gain-map decoder; its part of the HDR stills test will be skipped"
      - name: Cache the reference gain-map AVIF reader
        uses: actions/cache@v4
        with:
          path: ~/libavif
          key: libavif-${{ runner.os }}-${{ hashFiles('scripts/build-avifgainmaputil.sh') }}
      - name: The reference gain-map AVIF reader for the HDR stills test
        run: |
          (sudo apt-get update > /dev/null && sudo apt-get install -y --no-install-recommends libdav1d-dev > /dev/null && scripts/build-avifgainmaputil.sh ~/libavif) \
            && echo "MONTAGE_TEST_AVIFGAINMAP=$HOME/libavif/bin/avifgainmaputil" >> "$GITHUB_ENV" \
            || echo "::warning::Could not build libavif's avifgainmaputil; its part of the HDR stills test will be skipped"
      - name: libheif's decoder for the HDR stills test
        run: |
          sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265 > /dev/null \
            && echo "MONTAGE_TEST_HEIFDEC=$(command -v heif-dec || command -v heif-convert)" >> "$GITHUB_ENV" \
            || echo "::warning::Could not install libheif's decoder; its part of the HDR stills test will be skipped"
      - name: TTML2's schema and xmllint, for the IMSC test
        run: |
          (sudo apt-get install -y --no-install-recommends libxml2-utils > /dev/null && scripts/fetch-ttml-schema.sh ~/ttml2-xsd) \
            && echo "MONTAGE_TEST_TTML_SCHEMA=$HOME/ttml2-xsd/ttml2.xsd" >> "$GITHUB_ENV" \
            || echo "::warning::Could not fetch the TTML2 schema; the IMSC test's schema check will be skipped"
      - name: The EBU-TT-D schema, for the EBU-TT-D test
        run: |
          scripts/fetch-ebuttd-schema.sh ~/ebuttd-xsd \
            && echo "MONTAGE_TEST_EBUTTD_SCHEMA=$HOME/ebuttd-xsd/ebutt_d.xsd" >> "$GITHUB_ENV" \
            || echo "::warning::Could not fetch the EBU-TT-D schema; the EBU-TT-D test's schema check will be skipped"
      - name: pyaaf2, an independent AAF and MXF reader for the AAF tests
        run: |
          (python3 -m venv ~/pyaaf2 && ~/pyaaf2/bin/pip install -q pyaaf2==1.7.1) && echo "MONTAGE_TEST_PYAAF2=$HOME/pyaaf2/bin/python" >> "$GITHUB_ENV" \
            || echo "::warning::Could not install pyaaf2; the AAF tests' independent read-back will be skipped"
      - name: pyavb and pyaaf2, for the Avid bin tests (an independent bin reader, and bins written from AAFs)
        run: |
          (python3 -m venv ~/pyavb && ~/pyavb/bin/pip install -q pyavb==1.4.0 pyaaf2==1.7.1) && echo "MONTAGE_TEST_PYAVB=$HOME/pyavb/bin/python" >> "$GITHUB_ENV" \
            || echo "::warning::Could not install pyavb; the Avid bin tests' comparisons with pyavb will be skipped"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: The window read over AT-SPI, as a screen reader on Linux reads it
        run: |
          sudo apt-get install -y --no-install-recommends at-spi2-core python3-pyatspi > /dev/null
          build/src/montage-cli new -o "$RUNNER_TEMP/atspi.montage" tests/data/jfk.wav
          dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/atspi-check.py build/src/app/montage "$RUNNER_TEMP/atspi.montage"
      - name: AMWA's NMOS tests (IS-04 Node and IS-05) against the ST 2110 output's Node
        run: sudo scripts/nmos-check.sh build/src/montage-cli "$RUNNER_TEMP/nmos"

  # The GPU compositor needs Qt 6.6 or later (Ubuntu 24.04 has 6.4), so this job builds the render tests against Qt
  # 6.8 and runs the GPU ones on Mesa's software drivers: llvmpipe through OpenGL and lavapipe through Vulkan.
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          ./scripts/setup-deps.sh
          # (lavapipe; what Qt 6.8's xcb platform needs, as Vulkan is made only through a window system's plugin; and the
          # xkbcommon headers, as aqt's Qt6Gui targets link XKB::XKB)
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan-dev libegl-mesa0 libxcb-cursor0 \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 > /dev/null
      - name: Cache Qt 6.8
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-6.8.3-linux_gcc_64-shadertools
      - name: Qt 6.8 with Qt Shader Tools (aqtinstall)
        run: |
          if [ ! -d ~/Qt/6.8.3/gcc_64 ]; then
            python3 -m venv ~/aqt && ~/aqt/bin/pip install -q aqtinstall==3.3.0
            ~/aqt/bin/aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtshadertools -O ~/Qt
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.3/gcc_64" -DMONTAGE_BUILD_APP=OFF
      - name: Build the render tests
        run: cmake --build build --target test_render
      - name: GPU tests on llvmpipe (OpenGL) and lavapipe (Vulkan)
        env:
          QT_QPA_PLATFORM: xcb
          QTEST_FUNCTION_TIMEOUT: "900000"
          MONTAGE_GPU_LOG: "1"
        run: |
          # Every GPU test must run on both: a skip (no device, no shader compiler) fails the step.
          tests="gpuCompositorMatchesCpu gpuFallback gpuYcbcrPlanes gpuExportMatchesCpu gpuOcioMatchesCpu"
          for backend in opengl vulkan; do
            echo "::group::$backend"
            MONTAGE_GPU=$backend xvfb-run -a build/tests/test_render $tests -o "$RUNNER_TEMP/$backend.txt,txt" -o -,txt || failed=1
            echo "::endgroup::"
            if grep -q '^SKIP' "$RUNNER_TEMP/$backend.txt"; then
              grep '^SKIP' -A1 "$RUNNER_TEMP/$backend.txt"
              failed=1
            fi
          done
          exit "${failed:-0}"
