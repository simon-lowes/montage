name: Package

# Builds the macOS DMG and the Windows installer + portable zip. Every run
# uploads them as workflow artifacts. Pushing a tag like v0.1.0, or running
# the workflow by hand with a release tag, also publishes them as a GitHub
# Release (an existing release with that tag gets its files replaced), with
# the source of Montage and of every library the packages bundle.
#
# Both packages bundle the FFmpeg scripts/build-ffmpeg.sh builds (a fixed
# configuration, GPL-2.0-or-later, never nonfree), not a package manager's.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""
      target:
        description: "Commit the new tag points at (default: the commit being built)"
        required: false
        default: ""

# A newer push waits for the running packaging run instead of cancelling it,
# so each run reports both platforms.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

# A release run collects every bundled library's source here (scripts/package-*.sh), for the release.
env:
  MONTAGE_SOURCES_DIR: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && 'release-sources' || '' }}

jobs:
  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-15
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # Only the Qt modules Montage uses; the "qt" formula installs all of Qt.
        # FFmpeg itself is built below, from the libraries it uses.
        run: brew install qtbase qtmultimedia qttools qttranslations opencolorio lilv libraw openjpeg libmysofa onnxruntime openssl@3 ninja pkgconf x264 x265 libvpx svt-av1 dav1d opus lame srt librist
      - name: FFmpeg's libraries (part of its cache key)
        id: ffdeps
        run: echo "versions=$(brew list --versions x264 x265 libvpx svt-av1 dav1d opus lame openjpeg srt librist | shasum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-stage
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}-${{ steps.ffdeps.outputs.versions }}
      - name: FFmpeg
        run: |
          scripts/build-ffmpeg.sh "$HOME/ffmpeg" "$RUNNER_TEMP/ffmpeg-stage"
          mkdir -p "$HOME/ffmpeg" && cp -R "$RUNNER_TEMP/ffmpeg-stage$HOME/ffmpeg/." "$HOME/ffmpeg/"
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "MONTAGE_TEST_OAPV=$RUNNER_TEMP/ffmpeg-stage/oapv-apps" >> "$GITHUB_ENV"  # OpenAPV's apps, for the APV test
      - name: Rust version (part of the C2PA library's cache key)
        id: rust
        run: echo "version=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the C2PA library
        uses: actions/cache@v4
        with:
          path: ~/c2pa
          key: c2pa-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('scripts/build-c2pa.sh') }}
      - name: C2PA library (Content Credentials)
        run: scripts/build-c2pa.sh ~/c2pa
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DMONTAGE_REQUIRE_ONNXRUNTIME=ON -DMONTAGE_REQUIRE_OPENSSL=ON -DC2PA_ROOT="$HOME/c2pa" -DMONTAGE_REQUIRE_C2PA=ON
      - name: Build
        run: cmake --build build
      - name: Cache the AI models
        uses: actions/cache@v4
        with:
          path: ~/montage-models
          key: models-edgetam-8ca3d3e-speakers-9403a69-0743f30-clipq4-d15189d-dfn3-888f33c-esrgan-899dc1e-nafnet-f1f2551-faces-3cc26e7-3d70824-575c338-depth-4472b73-vda-2568753-rife-01fdc7e-modnet-fa2fa54-kokoro-1939ad2-lama-c3c0c9e-minilm-3c96c1d-ocr-1cfba2e-7b02d0a-clap-c28f288-spleeter4-v140
      - name: AI models for the object mask, speaker and visual search tests
        run: |
          scripts/fetch-models.sh ~/montage-models \
            && { echo "MONTAGE_OBJECT_MODEL=$HOME/montage-models/edgetam-video"; echo "MONTAGE_SPEAKER_MODEL=$HOME/montage-models/speakers"; echo "MONTAGE_VISUAL_MODEL=$HOME/montage-models/clip-vit-b32"; echo "MONTAGE_SPEECH_MODEL=$HOME/montage-models/speech-enhance"; echo "MONTAGE_UPSCALE_MODEL=$HOME/montage-models/upscale"; echo "MONTAGE_DEBLUR_MODEL=$HOME/montage-models/deblur"; echo "MONTAGE_FACE_MODEL=$HOME/montage-models/faces"; echo "MONTAGE_DEPTH_MODEL=$HOME/montage-models/depth"; echo "MONTAGE_VIDEO_DEPTH_MODEL=$HOME/montage-models/video-depth"; echo "MONTAGE_RIFE_MODEL=$HOME/montage-models/rife"; echo "MONTAGE_MATTE_MODEL=$HOME/montage-models/matte"; echo "MONTAGE_TTS_MODEL=$HOME/montage-models/tts"; echo "MONTAGE_INPAINT_MODEL=$HOME/montage-models/inpaint"; echo "MONTAGE_SENTENCE_MODEL=$HOME/montage-models/minilm-qa"; echo "MONTAGE_OCR_MODEL=$HOME/montage-models/ocr"; echo "MONTAGE_SOUND_MODEL=$HOME/montage-models/sound"; echo "MONTAGE_STEM_MODELS=$HOME/montage-models/stems"; } >> "$GITHUB_ENV" \
            || echo "::warning::Could not download the AI models; AI model tests will be skipped"
      - name: Cache the ProRes RAW sample
        uses: actions/cache@v4
        with:
          path: ~/montage-samples
          key: samples-prores-raw-ticket7887-2
      - name: ProRes RAW sample for the decode test
        # The first frame of the ProRes RAW test file on FFmpeg's sample server (its index is at the end of the 1 GB
        # file, which FFmpeg reads over HTTP without fetching the rest). It is fetched outside the cached folder, which
        # only exists once the file is whole, so a failed fetch is never cached.
        run: |
          f="$HOME/montage-samples/prores-raw.mov"
          part="$RUNNER_TEMP/prores-raw-part.mov"
          { test -s "$f" || { ffmpeg -nostdin -v error -i https://samples.ffmpeg.org/ffmpeg-bugs/trac/ticket7887/Filmplusgear-ProRes-RAW-testfiles-6.mov -map 0:v:0 -c copy -frames:v 1 -y "$part" && test -s "$part" && mkdir -p "$HOME/montage-samples" && mv "$part" "$f"; }; } \
            && echo "MONTAGE_TEST_PRORES_RAW=$f" >> "$GITHUB_ENV" \
            || echo "::warning::Could not fetch the ProRes RAW sample; its decode test will be skipped"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: scripts/package-macos.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: montage-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Sources for the release
        if: env.MONTAGE_SOURCES_DIR != ''
        run: scripts/package-sources.sh macos-arm64
      - uses: actions/upload-artifact@v4
        if: env.MONTAGE_SOURCES_DIR != ''
        with:
          name: montage-macos-sources
          path: dist/*-sources.tar
          if-no-files-found: error
      - name: Launch the packaged app
        timeout-minutes: 3
        run: |
          build/src/app/Montage.app/Contents/MacOS/Montage --screenshot montage-macos.png
          test -s montage-macos.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-macos
          path: montage-macos.png
          if-no-files-found: ignore

  windows:
    name: Windows installer (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip curl jq make diffutils git zstd
          # FFmpeg itself is built below, from the libraries it uses (Qt Multimedia still pulls in MSYS2's, which
          # this build replaces).
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p nasm:p
            qt6-base:p qt6-multimedia:p qt6-tools:p qt6-translations:p opencolorio:p lilv:p libraw:p openjpeg2:p libmysofa:p onnxruntime:p openssl:p rust:p expat:p
            x264:p x265:p libvpx:p svt-av1:p dav1d:p opus:p lame:p srt:p librist:p amf-headers:p ffnvcodec-headers:p libvpl:p
      - name: The abseil DLLs MSYS2's ONNX Runtime was built with
        # MSYS2 moves to a new abseil (its DLLs named for the release) before rebuilding every package on it; until
        # it rebuilds ONNX Runtime, the release that one needs is put back beside the new one, or nothing starts.
        run: |
          missing=$(grep -aoE 'libabsl_[a-z0-9_]+-[0-9]+\.0\.0\.dll' /ucrt64/bin/onnxruntime.dll | sort -u | while read -r d; do [ -f "/ucrt64/bin/$d" ] || echo "$d"; done)
          [ -z "$missing" ] && exit 0
          lts=$(echo "$missing" | head -n 1 | sed -E 's/.*-([0-9]+)\.0\.0\.dll/\1/')
          pkg=$(curl -sSfL https://repo.msys2.org/mingw/ucrt64/ | grep -oE "mingw-w64-ucrt-x86_64-abseil-cpp-20${lts}[0-9.]*-[0-9]+-any\.pkg\.tar\.zst" | sort -uV | tail -n 1)
          file="$(cygpath -u "$RUNNER_TEMP")/abseil.pkg.tar.zst"
          curl -sSfL -o "$file" "https://repo.msys2.org/mingw/ucrt64/$pkg"
          tar -C / --zstd -xf "$file" --wildcards 'ucrt64/bin/libabsl_*.dll'
          echo "::warning::ONNX Runtime still needs abseil $lts: its DLLs taken from $pkg"
      - name: FFmpeg's libraries (part of its cache key)
        id: ffdeps
        run: echo "versions=$(pacman -Q $(printf 'mingw-w64-ucrt-x86_64-%s ' x264 x265 libvpx svt-av1 dav1d opus lame openjpeg2 srt librist amf-headers ffnvcodec-headers libvpl) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-stage
          key: ffmpeg-${{ runner.os }}-ucrt64-${{ hashFiles('scripts/build-ffmpeg.sh') }}-${{ steps.ffdeps.outputs.versions }}
      - name: FFmpeg
        # Installed in /ucrt64 in place of MSYS2's FFmpeg, so Qt Multimedia's FFmpeg plugin loads this one too.
        run: |
          stage="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-stage"
          scripts/build-ffmpeg.sh /ucrt64 "$stage"
          # Qt Multimedia's FFmpeg plugin is built against MSYS2's FFmpeg, so it only loads this build while both
          # are the same release.
          want=$(sed -n 's/^VERSION=//p' scripts/build-ffmpeg.sh)
          have=$(pacman -Q mingw-w64-ucrt-x86_64-ffmpeg | cut -d' ' -f2)
          case "$have" in
            "$want"-*) ;;
            *) echo "MSYS2 has FFmpeg $have but scripts/build-ffmpeg.sh builds $want: update VERSION and SHA256 there" >&2; exit 1 ;;
          esac
          pacman -Rdd --noconfirm mingw-w64-ucrt-x86_64-ffmpeg
          cp -R "$stage/ucrt64/." /ucrt64/
          echo "MONTAGE_TEST_OAPV=$(cygpath -m "$stage/oapv-apps")" >> "$GITHUB_ENV"  # OpenAPV's apps, for the APV test
      - name: Rust version (part of the C2PA library's cache key)
        id: rust
        run: echo "version=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the C2PA library
        uses: actions/cache@v4
        with:
          path: ~/c2pa
          key: c2pa-${{ runner.os }}-ucrt64-${{ steps.rust.outputs.version }}-${{ hashFiles('scripts/build-c2pa.sh') }}
      - name: C2PA library (Content Credentials)
        run: scripts/build-c2pa.sh "$(cygpath -u "$USERPROFILE")/c2pa"  # where actions/cache's ~ points
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONTAGE_REQUIRE_ONNXRUNTIME=ON -DMONTAGE_REQUIRE_OPENSSL=ON -DC2PA_ROOT="$(cygpath -m "$USERPROFILE")/c2pa" -DMONTAGE_REQUIRE_C2PA=ON
      - name: Build
        run: cmake --build build
      - name: Cache the AI models
        uses: actions/cache@v4
        with:
          path: ~/montage-models
          key: models-edgetam-8ca3d3e-speakers-9403a69-0743f30-clipq4-d15189d-dfn3-888f33c-esrgan-899dc1e-nafnet-f1f2551-faces-3cc26e7-3d70824-575c338-depth-4472b73-vda-2568753-rife-01fdc7e-modnet-fa2fa54-kokoro-1939ad2-lama-c3c0c9e-minilm-3c96c1d-ocr-1cfba2e-7b02d0a-clap-c28f288-spleeter4-v140
      - name: AI models for the object mask, speaker and visual search tests
        run: |
          dir="$(cygpath -u "$USERPROFILE")/montage-models"  # where actions/cache's ~ points
          scripts/fetch-models.sh "$dir" \
            && { echo "MONTAGE_OBJECT_MODEL=$(cygpath -m "$dir/edgetam-video")"; echo "MONTAGE_SPEAKER_MODEL=$(cygpath -m "$dir/speakers")"; echo "MONTAGE_VISUAL_MODEL=$(cygpath -m "$dir/clip-vit-b32")"; echo "MONTAGE_SPEECH_MODEL=$(cygpath -m "$dir/speech-enhance")"; echo "MONTAGE_UPSCALE_MODEL=$(cygpath -m "$dir/upscale")"; echo "MONTAGE_DEBLUR_MODEL=$(cygpath -m "$dir/deblur")"; echo "MONTAGE_FACE_MODEL=$(cygpath -m "$dir/faces")"; echo "MONTAGE_DEPTH_MODEL=$(cygpath -m "$dir/depth")"; echo "MONTAGE_VIDEO_DEPTH_MODEL=$(cygpath -m "$dir/video-depth")"; echo "MONTAGE_RIFE_MODEL=$(cygpath -m "$dir/rife")"; echo "MONTAGE_MATTE_MODEL=$(cygpath -m "$dir/matte")"; echo "MONTAGE_TTS_MODEL=$(cygpath -m "$dir/tts")"; echo "MONTAGE_INPAINT_MODEL=$(cygpath -m "$dir/inpaint")"; echo "MONTAGE_SENTENCE_MODEL=$(cygpath -m "$dir/minilm-qa")"; echo "MONTAGE_OCR_MODEL=$(cygpath -m "$dir/ocr")"; echo "MONTAGE_SOUND_MODEL=$(cygpath -m "$dir/sound")"; echo "MONTAGE_STEM_MODELS=$(cygpath -m "$dir/stems")"; } >> "$GITHUB_ENV" \
            || echo "::warning::Could not download the AI models; AI model tests will be skipped"
      - name: Test
        # Qt Test's console output does not reach this log on Windows, so a failing binary is run again writing its
        # results to a file; every failure is printed (and annotated) with where and why, and the log in full is kept.
        run: |
          ctest --test-dir build --output-on-failure || {
            for t in $(ctest --test-dir build --rerun-failed --show-only=json-v1 | sed -n 's/.*"name" *: *"\(test_[a-z]*\)".*/\1/p' | sort -u); do
              # (what failed under ctest itself, which a second run can miss)
              { grep -A3 '^FAIL!' "build/tests/$t-ctest.txt" | tr -d '\r' | awk '/^FAIL!/ { if (m) print m; m = $0; next } /^[ \t]/ { m = m " " $0 } END { if (m) print m }' |
                  while read -r line; do echo "::error title=$t under ctest::$line"; done; } 2>/dev/null || true
              grep -q '^Totals' "build/tests/$t-ctest.txt" 2>/dev/null ||
                echo "::error title=$t under ctest::stopped before the end (crashed?); last lines: $(tail -n 3 "build/tests/$t-ctest.txt" 2>/dev/null | tr -d '\r' | tr '\n' ' ')"
              log="build/tests/$t-results.txt"
              code=0
              (cd build/tests && QT_QPA_PLATFORM=offscreen "./$t.exe" -maxwarnings 0 -o "$t-results.txt,txt") || code=$?
              echo "::group::$t (exit code $code)"; cat "$log" 2>/dev/null || echo "no results were written"; echo "::endgroup::"
              { grep -A3 '^FAIL!' "$log" | tr -d '\r' | awk '/^FAIL!/ { if (m) print m; m = $0; next } /^[ \t]/ { m = m " " $0 } END { if (m) print m }' |
                  while read -r line; do echo "::error title=$t::$line"; done; } 2>/dev/null || true
              if ! grep -q '^Totals' "$log" 2>/dev/null; then
                echo "::error title=$t::stopped before the end (crashed?); last lines: $(tail -n 3 "$log" 2>/dev/null | tr -d '\r' | tr '\n' ' ')"
              fi
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-windows
          path: |
            build/tests/*-results.txt
            build/tests/*-ctest.txt
          if-no-files-found: ignore
      - name: Package (portable zip)
        run: scripts/package-windows.sh build
      - name: Package (installer)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Montage VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DVersion=$version" packaging\windows\montage.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: montage-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Sources for the release
        if: env.MONTAGE_SOURCES_DIR != ''
        run: scripts/package-sources.sh windows-x64
      - uses: actions/upload-artifact@v4
        if: env.MONTAGE_SOURCES_DIR != ''
        with:
          name: montage-windows-sources
          path: dist/*-sources.tar
          if-no-files-found: error
      - name: Launch the packaged app
        timeout-minutes: 3
        run: |
          dist/Montage/montage.exe --screenshot montage-windows.png
          test -s montage-windows.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows
          path: montage-windows.png
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: montage-*
          merge-multiple: true
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET: ${{ inputs.target || github.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
              --title "Montage ${TAG#v}" --generate-notes
          fi
